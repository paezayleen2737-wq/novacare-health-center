<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Médicos · NovaCare Health Center</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="app-shell">
    <div id="nc-sidebar"></div>

    <div class="main-column">
      <div id="nc-header"></div>

      <main class="page-content">
        <div class="page-header">
          <div class="page-header-title">
            <h2>Médicos</h2>
            <p>Gestiona el cuerpo médico de la clínica</p>
          </div>
          <div class="page-header-actions">
            <div class="search-input">
              <span id="icon-search"></span>
              <input type="text" id="search-medicos" placeholder="Buscar por nombre o especialidad…" />
            </div>
            <button class="btn btn-primary" id="btn-nuevo-medico">
              <span id="icon-plus"></span>
              Nuevo médico
            </button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Especialidad</th>
                <th>Consultorio</th>
                <th>Teléfono</th>
                <th>Correo</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="medicos-tbody"></tbody>
          </table>
          <div id="medicos-empty" class="empty-state" hidden>
            <div class="empty-state-icon" id="icon-empty"></div>
            <div class="empty-state-title">No se encontraron médicos</div>
            <div class="empty-state-sub" id="medicos-empty-sub">Registra el primer médico con el botón "Nuevo médico".</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal: crear / editar médico -->
  <div class="modal-overlay" id="modal-medico">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2 id="modal-medico-title">Nuevo médico</h2>
          <p>Completa los datos del médico</p>
        </div>
        <button class="modal-close" type="button" id="modal-medico-close"><span id="icon-close-1"></span></button>
      </div>
      <form id="form-medico">
        <div class="modal-body">
          <div class="form-error" id="medico-form-error" hidden></div>

          <div class="form-grid">
            <div class="field">
              <label for="m-nombre">Nombre</label>
              <input type="text" id="m-nombre" required />
            </div>
            <div class="field">
              <label for="m-apellido">Apellido</label>
              <input type="text" id="m-apellido" required />
            </div>
            <div class="field">
              <label for="m-especialidad">Especialidad</label>
              <input type="text" id="m-especialidad" required placeholder="Ej. Pediatría" />
            </div>
            <div class="field">
              <label for="m-consultorio">Consultorio</label>
              <input type="text" id="m-consultorio" class="dato" required placeholder="Ej. 101" />
            </div>
            <div class="field">
              <label for="m-telefono">Teléfono (opcional)</label>
              <input type="text" id="m-telefono" class="dato" />
            </div>
            <div class="field">
              <label for="m-email">Correo electrónico (opcional)</label>
              <input type="email" id="m-email" />
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-cancelar-medico">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-guardar-medico">Guardar médico</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/medicos.js"></script>
</body>
</html>
